name: Build VST3 (Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MSVC-Umgebung einrichten (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake + Ninja, Release)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package VST3
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1
          if (-not $bundle) { throw "Keine .vst3 gefunden" }
          Write-Host "Gefunden: $($bundle.FullName)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path $bundle.FullName -Destination dist -Recurse
          Compress-Archive -Path "dist/*" -DestinationPath "CrazyVisualEQ-VST3-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrazyVisualEQ-VST3-Windows
          path: dist

      - name: Create release (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CrazyVisualEQ-VST3-Windows.zip
